name: Evidence API Service Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-api-service-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `needs` and no `if`: this is the one check that must run on every pull
  # request, whatever it touched. It lived inside evidence_api_gate, which runs
  # only when the planner sets `full` or `evidence_api` -- and a docs-only pull
  # request sets neither, while docs/validation/ is precisely where restricted
  # corpus text was found and removed. A graph-only change skipped it too. The
  # guard was absent from the changes most likely to trip it.
  #
  # It is stdlib-only and takes about a second, so it needs no dependency
  # install. It catches only runs already removed -- the corpus-backed scan is
  # the thorough half and needs the corpus. See
  # scripts/validation/RESTRICTED_CORPORA.md.
  restricted_corpus_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check for re-introduced restricted corpus text
        run: make restricted-corpus-digest-check

  plan_service_checks:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      evidence_api: ${{ steps.plan.outputs.evidence_api }}
      graph_service: ${{ steps.plan.outputs.graph_service }}
      repo_control: ${{ steps.plan.outputs.repo_control }}
      full: ${{ steps.plan.outputs.full }}
      targeted_tests: ${{ steps.plan.outputs.targeted_tests }}
      targeted_test_paths: ${{ steps.plan.outputs.targeted_test_paths }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            git diff --name-only "origin/${{ github.base_ref }}"...HEAD > /tmp/changed-files.txt
          else
            : > /tmp/changed-files.txt
          fi

      - name: Plan service checks
        id: plan
        run: |
          python3 scripts/ci/plan_service_checks.py \
            --changed-files /tmp/changed-files.txt \
            --event-name "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            >> "$GITHUB_OUTPUT"

  evidence_api_targeted_tests:
    needs: plan_service_checks
    if: needs.plan_service_checks.outputs.targeted_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: make install-dev

      - name: Run changed unit tests
        run: venv/bin/python3 -m pytest ${{ needs.plan_service_checks.outputs.targeted_test_paths }} -q

  # `&& full != 'true'` used to sit on this condition, on the assumption that a
  # full run covers these. It does not: the full branch of evidence_api_gate
  # runs static checks and coverage, and no coverage path includes
  # tests/unit/test_control_files.py. So on every high-risk change -- any
  # workflow or migration edit -- the repository control tests were the one
  # thing that silently did not run.
  evidence_api_repo_control_checks:
    needs: plan_service_checks
    if: needs.plan_service_checks.outputs.repo_control == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: make install-dev

      - name: Run repository control tests
        run: |
          venv/bin/python3 -m pytest \
            tests/unit/test_ci_service_check_planner.py \
            tests/unit/test_control_files.py \
            tests/unit/test_coverage_enforcement_contract.py \
            tests/unit/test_makefile_type_gate_contract.py \
            tests/unit/test_relation_feasibility_audit.py \
            services/artana_evidence_api/tests/unit/test_deploy_runtime_regressions.py \
            -q

  evidence_api_gate:
    needs: plan_service_checks
    if: needs.plan_service_checks.outputs.full == 'true' || needs.plan_service_checks.outputs.evidence_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: artana_dev
          POSTGRES_USER: artana_dev
          POSTGRES_PASSWORD: artana_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U artana_dev -d artana_dev"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: make install-dev

      - name: Write Postgres env file
        run: |
          printf '%s\n' \
            'ARTANA_POSTGRES_DB=artana_dev' \
            'ARTANA_POSTGRES_USER=artana_dev' \
            'ARTANA_POSTGRES_PASSWORD=artana_dev_password' \
            'ARTANA_POSTGRES_PORT=5432' \
            'ARTANA_POSTGRES_HOST=127.0.0.1' \
            'DATABASE_URL=postgresql+psycopg2://artana_dev:artana_dev_password@127.0.0.1:5432/artana_dev' \
            'ASYNC_DATABASE_URL=postgresql+asyncpg://artana_dev:artana_dev_password@127.0.0.1:5432/artana_dev' \
            'ALEMBIC_DATABASE_URL=postgresql+psycopg2://artana_dev:artana_dev_password@127.0.0.1:5432/artana_dev' \
            'FLUJO_STATE_URI=postgresql://artana_dev:artana_dev_password@127.0.0.1:5432/artana_dev?options=-c%20search_path=flujo,public' \
            'ARTANA_ENABLE_ENTITY_EMBEDDINGS=0' \
            'ARTANA_ENABLE_RELATION_SUGGESTIONS=0' \
            'NCBI_API_KEY=' \
            'NCBI_EMAIL=' \
            'NCBI_TOOL=artana-resource-library' \
            'ARTANA_ADMIN_PASSWORD=change_me_locally1' \
            > .env.postgres

      - name: Run evidence API checks
        run: |
          if [ "${{ needs.plan_service_checks.outputs.full }}" = "true" ]; then
            make artana-evidence-api-static-checks
            make coverage-check
          else
            make artana-evidence-api-service-checks
          fi

  evidence-api-service-checks:
    needs:
      - plan_service_checks
      - restricted_corpus_guard
      - evidence_api_targeted_tests
      - evidence_api_repo_control_checks
      - evidence_api_gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize Evidence API service checks
        run: |
          echo "docs_only=${{ needs.plan_service_checks.outputs.docs_only }}"
          echo "targeted_tests=${{ needs.plan_service_checks.outputs.targeted_tests }}"
          echo "repo_control=${{ needs.plan_service_checks.outputs.repo_control }}"
          echo "evidence_api=${{ needs.plan_service_checks.outputs.evidence_api }}"
          echo "full=${{ needs.plan_service_checks.outputs.full }}"
          # Success only, never skipped: this one has no condition to skip on,
          # so a skip means the job was removed or its dependencies were and
          # the summary must not pass that off as a clean run.
          if [ "${{ needs.restricted_corpus_guard.result }}" != "success" ]; then
            echo "restricted corpus guard did not run to success"
            exit 1
          fi
          case "${{ needs.evidence_api_targeted_tests.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
          case "${{ needs.evidence_api_repo_control_checks.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
          case "${{ needs.evidence_api_gate.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
