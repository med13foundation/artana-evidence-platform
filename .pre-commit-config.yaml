default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: graph-service-lint
        name: graph service lint
        entry: make -s graph-service-lint
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: evidence-api-lint
        name: evidence API lint
        entry: make -s artana-evidence-api-lint
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: graph-service-type-check
        name: graph service type check
        entry: make -s graph-service-type-check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: evidence-api-type-check
        name: evidence API type check
        entry: make -s artana-evidence-api-type-check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # CI enforces these and pre-commit did not, so a change that added a
      # module passed locally and failed in CI. That happened twice, and the
      # second time the failing branch was merged and broke main.
      - id: architecture-structure-check
        name: architecture structure
        entry: make -s architecture-structure-check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: architecture-size-check
        name: architecture size
        entry: make -s architecture-size-check
        language: system
        pass_filenames: false
        stages: [pre-commit]
