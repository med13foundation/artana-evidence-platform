default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: graph-service-lint
        name: graph service lint
        entry: make -s graph-service-lint
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: evidence-api-lint
        name: evidence API lint
        entry: make -s artana-evidence-api-lint
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: graph-service-type-check
        name: graph service type check
        entry: make -s graph-service-type-check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: evidence-api-type-check
        name: evidence API type check
        entry: make -s artana-evidence-api-type-check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # CI enforces these and pre-commit did not, so a change that added a
      # module passed locally and failed in CI. That happened twice, and the
      # second time the failing branch was merged and broke main.
      - id: architecture-structure-check
        name: architecture structure
        entry: make -s architecture-structure-check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: architecture-size-check
        name: architecture size
        entry: make -s architecture-size-check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # Restricted corpus text reached HEAD three times, and each time the
      # commit that introduced it also passed review. The thorough scan needs
      # the corpus and so cannot run here; this is the half that can, and it
      # catches the cheapest failure mode -- a revert or a paste putting back
      # prose we already removed. It is not a clean bill of health: see
      # scripts/validation/RESTRICTED_CORPORA.md for what it cannot see.
      - id: restricted-corpus-digest-check
        name: restricted corpus text
        entry: make -s restricted-corpus-digest-check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # AGENTS.md has banned `Any` in new Python for as long as it has existed,
      # and the enforcement was people reading diffs. Seven annotations reached
      # HEAD on one branch anyway; three were caught in review, a sweep for the
      # rest was reported as done, and four survived it. ruff cannot express
      # the rule -- ANN401 covers parameters and returns, not the local
      # `fixture: dict[str, Any] = load(...)` that actually slipped -- so this
      # parses instead, and runs here because a rule checked only in a gate
      # somebody has to remember to run is the rule that just failed.
      - id: typing-any-check
        name: typing `Any` ban
        entry: make -s typing-any-check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # Same story as the architecture checks above, one layer out: the
      # contract checks were CI-only and cost two round-trips on #210, where
      # adding a GraphValidationCode member needs BOTH openapi.json and the
      # TypeScript client regenerated. They could not be added earlier without
      # producing false greens -- the export targets had no PYTHONPATH, so from
      # a git worktree they checked the primary checkout's contract instead.
      - id: graph-service-contract-check
        name: graph service contract
        entry: make -s graph-service-contract-check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: evidence-api-contract-check
        name: evidence API contract
        entry: make -s artana-evidence-api-contract-check
        language: system
        pass_filenames: false
        stages: [pre-commit]
